server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip common text assets for faster loads.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cache hashed build assets aggressively; index.html itself is never cached
    # so a new deploy is always picked up immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router uses client-side routes (e.g. /app/dashboard) that don't
    # exist as real files — always fall back to index.html and let the SPA
    # router take over, instead of nginx returning its own 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
